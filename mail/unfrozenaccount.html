<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Уведомление о разморозке аккаунта</title>
</head>
<body style="margin:0;padding:0;background:#0f172a;font-family:'Segoe UI',Tahoma,Verdana,sans-serif;color:#e2e8f0;">
<div style="width:100%;padding:32px 16px;box-sizing:border-box;">
    <div style="max-width:480px;margin:0 auto;background:linear-gradient(145deg,rgba(15,23,42,0.92),rgba(30,41,59,0.92));border:1px solid rgba(148,163,184,0.2);border-radius:20px;padding:32px 28px;text-align:center;box-shadow:0 24px 48px rgba(15,23,42,0.45);">
        <div style="font-size:20px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#f8fafc;margin-bottom:12px;">ARX</div>

        <p style="font-size:16px;line-height:1.6;color:#cbd5f5;margin:0 0 28px;">
            Здравствуйте, <strong style="color:#f8fafc;">${login}</strong>! Ваш аккаунт был успешно разморожен!
        </p>
        <p style="font-size:14px;line-height:1.6;color:#94a3b8;margin:24px 0;">
            Рады видеть вас снова на платформе. Если у вас возникнут вопросы, наша служба поддержки всегда готова помочь.
        </p>
        <div style="font-size:13px;color:#64748b;border-top:1px solid rgba(148,163,184,0.15);margin-top:24px;padding-top:16px;">
            С уважением,<br />Команда ARX Hosting
        </div>
    </div>
</div>
